#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "i2pd"
name = "i2pd"
description.en = "Lightweight C++ router for the I2P anonymous network"
description.fr = "Routeur C++ léger pour le réseau anonyme I2P"

version = "3.0.0~ynh4"

maintainers = []

[upstream]
license = "BSD-3-Clause"
website = "https://i2pd.website"
admindoc = "https://i2pd.readthedocs.io/en/latest/"
code = "https://github.com/PurpleI2P/i2pd"

[integration]
yunohost = ">= 12.0"
helpers_version = "2.1"
architectures = ["amd64", "i386", "armhf", "arm64"]
# machine-global: one fixed system user/unit from the deb, no per-instance isolation
multi_instance = false
ldap = "not_relevant"
sso = "not_relevant"
disk = "100M"
ram.build = "128M"
ram.runtime = "256M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    # webconsole emits absolute links: root of a dedicated (sub)domain
    type = "path"
    default = "/"

    [install.init_main_permission]
    # The webconsole is proxied through nginx and gated by the SSO portal.
    help.en = "The i2pd webconsole is proxied through nginx and protected by the YunoHost SSO portal; members of this group will be able to view it."
    type = "group"
    default = "all_users"

    [install.port_http]
    ask.en = "HTTP proxy port"
    help.en = "Port of i2pd's built-in eepsite HTTP proxy, bound to localhost only. The upstream default is 4444 — the same port the Java I2P router (java_i2p app) uses for its HTTP proxy. If that app is installed on this server, pick another port, e.g. 4447."
    type = "string"
    default = "4444"

    [install.port_socks]
    ask.en = "SOCKS proxy port"
    help.en = "Port of i2pd's built-in SOCKS proxy (localhost only). The upstream default is 4447, which does not clash with the Java I2P router (java_i2p app — its proxies are 4444/4445). Move it only if you picked 4447 for the HTTP proxy above, e.g. to 4448."
    type = "string"
    default = "4447"

    [install.port_sam]
    ask.en = "SAM bridge port"
    help.en = "TCP port of i2pd's SAMv3 bridge for local applications (localhost only). Upstream default 7656; if it is already taken (e.g. the java_i2p app's SAM), the install automatically falls back to 7666 so both routers coexist."
    type = "string"
    default = "7656"

[resources]
    [resources.permissions]
        main.url = "/"
        # The webconsole has no authentication of its own; the SSO portal
        # gates the URL, so ssowat must not inject Basic credentials.
        main.auth_header = false

    [resources.ports]
        # loopback + nginx proxy: reserved, never firewalled
        main.default = 7070
        # I2NP peer port (NTCP2+SSU2), upstream default; fixed for stable port-forward.
        # NB: java_i2p uses 51427, defaults must not clash.
        ext.default = 4567
        ext.exposed = "Both"
        ext.fixed = true
