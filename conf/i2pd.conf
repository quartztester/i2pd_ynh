# i2pd configuration — managed by the YunoHost app 'i2pd'.
# Local edits are detected at upgrade time (you will be asked to keep them).
# Full reference: https://i2pd.readthedocs.io/en/latest/user/configuration/

# Volunteer as a floodfill router: answer distributed-network-database
# queries for everyone — the main way to contribute capacity to I2P.
# Set to false for a plain relay.
floodfill = true

# 'info' keeps the webconsole diagnostics useful without flooding the log.
loglevel = info

# I2NP peer port — NTCP2 (TCP) and SSU2 (UDP) share it. Opened in the
# YunoHost firewall by the app's 'ext' port resource; forward it as
# TCP+UDP on your internet router for an "OK" (not firewalled) status.
port = __PORT_EXT__

[http]
# Webconsole: loopback only. nginx proxies it at https://<domain><path>
# behind the YunoHost SSO portal.
address = 127.0.0.1
port = __PORT__

[httpproxy]
# Built-in eepsite HTTP proxy (localhost only), e.g.:
#   curl -x http://127.0.0.1:__PORT_HTTP__ http://identiguy.i2p/
# NB: the java_i2p app (Java I2P router) serves its HTTP proxy on 4444 —
# this port is chosen at install time to avoid that conflict.
address = 127.0.0.1
port = __PORT_HTTP__

[socksproxy]
# Built-in eepsite SOCKS proxy (localhost only).
address = 127.0.0.1
port = __PORT_SOCKS__

[sam]
# SAMv3 bridge for local applications and containers (localhost only).
# NB: the java_i2p app's SAM bridge also defaults to 7656 — this port is
# chosen at install time to avoid that conflict.
enabled = true
address = 127.0.0.1
port = __PORT_SAM__
portudp = __PORT_SAM_UDP__

# Everything else keeps upstream defaults: bob / i2cp / i2pcontrol
# disabled (leave [i2cp] off when java_i2p is installed — the Java router
# serves I2CP on 7654), reseed verification on, addressbook subscriptions
# enabled, native datadir /var/lib/i2pd (reseed certificates ship inside
# the deb).
