# Drop-in for the upstream deb's i2pd.service — this app does not ship
# its own unit: the deb's (including its AppArmor profile) is used as-is.
[Service]
Restart=on-failure
RestartSec=5s
# Type=forking: start completes only after i2pd writes its pidfile, which
# happens after router-key generation — can take minutes on a loaded box.
TimeoutStartSec=300
TimeoutStopSec=45s
