# i2pd client/server tunnels — managed by the YunoHost app 'i2pd'.
# Syntax reference: https://i2pd.readthedocs.io/en/latest/user/tunnels/
#
# The built-in HTTP/SOCKS proxies and the SAM bridge are configured in
# i2pd.conf, not here. Drop-in files can be added in
# /etc/i2pd/tunnels.conf.d/ without touching this file (they are picked
# up thanks to the unit's --tunnelsdir option).
#
# Example client tunnel (local port 6669 -> an I2P IRC network):
#
# [IRC-ILITA]
# type = client
# address = 127.0.0.1
# port = 6669
# destination = irc.ilita.i2p
# keys = irc-keys.dat
#
# Example server tunnel (publishing a local service inside I2P):
#
# [my-eepsite]
# type = server
# address = 127.0.0.1
# port = 8080
# keys = my-eepsite.dat
